services:
  - type: web
    name: caliber-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: '3.12'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: interview_bot
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Set to the Vercel URL once the frontend is deployed (see DEPLOYMENT.md step 4).
      - key: CORS_ORIGINS
        sync: false
      # Password-reset email via Brevo HTTP API (works on free Render; SMTP is blocked).
      # Set BREVO_API_KEY (xkeysib-…) and FROM_EMAIL (a *verified* Brevo sender) in the dashboard.
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Caliber
      - key: FRONTEND_URL
        value: https://caliber-prep.vercel.app
