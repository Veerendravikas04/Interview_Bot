services:
  - type: web
    name: caliber-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: '3.12'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: interview_bot
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Set to the Vercel URL once the frontend is deployed (see DEPLOYMENT.md step 4).
      - key: CORS_ORIGINS
        sync: false
